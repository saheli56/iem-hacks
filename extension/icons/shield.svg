<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1e"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0a0a5"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Shield icon -->
  <path d="M64 22 L96 36 C96 36 100 72 64 106 C28 72 32 36 32 36 Z" 
        fill="none" stroke="url(#shield)" stroke-width="5" stroke-linejoin="round"/>
  <!-- Checkmark inside shield -->
  <path d="M50 64 L60 74 L78 52" 
        fill="none" stroke="url(#shield)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
